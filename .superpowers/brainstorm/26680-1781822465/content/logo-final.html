<div style="text-align:center; padding:20px;">
  <h2>تصميم اللوجو - حسب رسمتك</h2>
  <p class="subtitle">بوابة زاوية + هلال على القوس + 3 أشعة</p>

  <div class="cards">
    <div class="card selected" data-choice="final" onclick="toggleSelect(this)">
      <div class="card-image" style="background:#0D1F17; padding:30px; display:flex; flex-direction:column; align-items:center; gap:15px;">
        <svg width="140" height="140" viewBox="0 0 140 140">
          <!-- Outer gate - pointed arch (angular) -->
          <path d="M30 120 L30 55 L70 20 L110 55 L110 120" fill="none" stroke="#FFD700" stroke-width="4"/>
          <!-- Inner gate line -->
          <path d="M38 120 L38 58 L70 28 L102 58 L102 120" fill="none" stroke="#FFD700" stroke-width="2"/>
          
          <!-- Palm trunk -->
          <line x1="70" y1="115" x2="70" y2="75" stroke="#2E7D32" stroke-width="4"/>
          <!-- Palm fronds - curved like user drew -->
          <path d="M70 80 Q50 70 38 78" fill="none" stroke="#4CAF50" stroke-width="3"/>
          <path d="M70 80 Q90 70 102 78" fill="none" stroke="#4CAF50" stroke-width="3"/>
          <path d="M70 85 Q55 78 42 85" fill="none" stroke="#66BB6A" stroke-width="2.5"/>
          <path d="M70 85 Q85 78 98 85" fill="none" stroke="#66BB6A" stroke-width="2.5"/>
          
          <!-- Crescent sitting ON the arch peak -->
          <circle cx="70" cy="18" r="10" fill="#FFD700"/>
          <circle cx="74" cy="16" r="8" fill="#0D1F17"/>
          
          <!-- 3 light rays from top of crescent -->
          <line x1="70" y1="6" x2="70" y2="-5" stroke="#FFD700" stroke-width="2.5" opacity="0.7"/>
          <line x1="60" y1="8" x2="52" y2="-2" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
          <line x1="80" y1="8" x2="88" y2="-2" stroke="#FFD700" stroke-width="2" opacity="0.5"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>التصميم النهائي</h3>
        <p>بوابة زاوية + خط داخلي + نخل + هلال على القوس + 3 أشعة</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>ده بالظبط اللي رسمته - بوابة زاوية حادة + الهلال قاعد على رأس القوس + أشعة من فوق</p>
    <p style="color:#FFD700; margin-top:10px;">قولي لو تمام ونبدأ السبيلاش، أو لو عايز تعديل</p>
  </div>
</div>
