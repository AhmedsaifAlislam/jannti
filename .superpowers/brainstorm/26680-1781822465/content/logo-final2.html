<div style="text-align:center; padding:20px;">
  <h2>تصميم اللوجو - حسب رسمتك بالظبط</h2>
  <p class="subtitle">بوابة سقف + هلال على القوس + 3 أشعة</p>

  <div class="cards">
    <div class="card selected" data-choice="final2" onclick="toggleSelect(this)">
      <div class="card-image" style="background:#0D1F17; padding:30px; display:flex; flex-direction:column; align-items:center; gap:15px;">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <!-- Outer gate - house roof shape -->
          <path d="M25 130 L25 60 L80 15 L135 60 L135 130" fill="none" stroke="#FFD700" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Inner gate line -->
          <path d="M35 130 L35 63 L80 25 L125 63 L125 130" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Palm trunk -->
          <line x1="80" y1="125" x2="80" y2="85" stroke="#2E7D32" stroke-width="5" stroke-linecap="round"/>
          <!-- Palm fronds - simple curved like drawing -->
          <path d="M80 90 Q60 80 45 88" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M80 90 Q100 80 115 88" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M80 95 Q65 88 50 95" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
          <path d="M80 95 Q95 88 110 95" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Crescent sitting ON the arch peak - touching -->
          <circle cx="80" cy="14" r="12" fill="#FFD700"/>
          <circle cx="85" cy="12" r="10" fill="#0D1F17"/>
          
          <!-- 3 light rays from top of crescent -->
          <line x1="80" y1="0" x2="80" y2="-12" stroke="#FFD700" stroke-width="3" opacity="0.8" stroke-linecap="round"/>
          <line x1="68" y1="4" x2="58" y2="-8" stroke="#FFD700" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
          <line x1="92" y1="4" x2="102" y2="-8" stroke="#FFD700" stroke-width="2.5" opacity="0.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>التصميم النهائي</h3>
        <p>بوابة على شكل سقف + خط داخلي + نخل بسيط + هلال على القوس + 3 أشعة</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>قولي لو ده قريب من رسمتك أو لسه محتاج تعديل - ممكن تبعتلي رسمة تانية لو عايز</p>
  </div>
</div>
