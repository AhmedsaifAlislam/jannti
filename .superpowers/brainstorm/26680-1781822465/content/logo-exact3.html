<div style="text-align:center; padding:20px;">
  <h2>التصميم النهائي - إضاءة كاملة</h2>
  <p class="subtitle">هالة الهلال مش مقصوصة</p>

  <div class="cards">
    <div class="card selected" data-choice="exact3" onclick="toggleSelect(this)">
      <div class="card-image" style="background:#0D1F17; padding:20px; display:flex; flex-direction:column; align-items:center; gap:15px;">
        <svg width="220" height="260" viewBox="-20 -40 240 280">
          <defs>
            <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          
          <!-- Outer gate - rounded shoulders -->
          <path d="M30 210 L30 85 Q30 65 50 50 L100 15 L150 50 Q170 65 170 85 L170 210" 
                fill="none" stroke="#FFD700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Inner gate line -->
          <path d="M42 210 L42 88 Q42 70 58 57 L100 28 L142 57 Q158 70 158 88 L158 210" 
                fill="none" stroke="#FFD700" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Palm trunk -->
          <line x1="100" y1="205" x2="100" y2="115" stroke="#2E7D32" stroke-width="7" stroke-linecap="round"/>
          <!-- Palm fronds -->
          <path d="M100 120 Q75 105 50 115" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 120 Q125 105 150 115" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 125 Q80 115 55 125" fill="none" stroke="#66BB6A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M100 125 Q120 115 145 125" fill="none" stroke="#66BB6A" stroke-width="3.5" stroke-linecap="round"/>
          
          <!-- Glow behind crescent - full circle, not clipped -->
          <circle cx="100" cy="14" r="30" fill="#FFD700" opacity="0.12" filter="url(#glow)"/>
          
          <!-- Crescent -->
          <circle cx="100" cy="14" r="16" fill="#FFD700" filter="url(#glow)"/>
          <circle cx="106" cy="11" r="13" fill="#0D1F17"/>
          
          <!-- 3 light rays - full length -->
          <line x1="100" y1="-5" x2="100" y2="-35" stroke="#FFD700" stroke-width="4" opacity="0.7" stroke-linecap="round" filter="url(#glow)"/>
          <line x1="82" y1="0" x2="60" y2="-30" stroke="#FFD700" stroke-width="3" opacity="0.5" stroke-linecap="round" filter="url(#glow)"/>
          <line x1="118" y1="0" x2="140" y2="-30" stroke="#FFD700" stroke-width="3" opacity="0.5" stroke-linecap="round" filter="url(#glow)"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>التصميم - إضاءة كاملة</h3>
        <p>هالة الهلال + أشعة كاملة بدون قص</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>قولي لو كده الإضاءة بقت كاملة أو لسه محتاجة تعديل</p>
  </div>
</div>
