<div style="text-align:center; padding:20px;">
  <h2>التصميم النهائي - حسب مبادئ Brandkit</h2>
  <p class="subtitle">بوابة + نخل + هلال - تصميم راقي</p>

  <div class="cards">
    <div class="card selected" data-choice="brandkit" onclick="toggleSelect(this)">
      <div class="card-image" style="padding:0; display:flex; flex-direction:column; align-items:center; border-radius:12px; overflow:hidden;">
        <svg width="240" height="280" viewBox="-30 -50 280 300">
          <defs>
            <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#071a10"/>
              <stop offset="50%" stop-color="#0d2818"/>
              <stop offset="100%" stop-color="#143d24"/>
            </linearGradient>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFD700"/>
              <stop offset="100%" stop-color="#B8860B"/>
            </linearGradient>
            <linearGradient id="palmGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2E7D32"/>
              <stop offset="100%" stop-color="#1B5E20"/>
            </linearGradient>
            <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          
          <!-- Background -->
          <rect x="-30" y="-50" width="280" height="300" fill="url(#bgGrad)"/>
          
          <!-- Outer gate - refined proportions -->
          <path d="M35 220 L35 80 Q35 55 60 40 L110 8 L160 40 Q185 55 185 80 L185 220" 
                fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Inner gate line -->
          <path d="M45 220 L45 82 Q45 60 65 47 L110 20 L155 47 Q175 60 175 82 L175 220" 
                fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Palm trunk -->
          <line x1="110" y1="215" x2="110" y2="130" stroke="url(#palmGrad)" stroke-width="6" stroke-linecap="round"/>
          <!-- Palm fronds - elegant curves -->
          <path d="M110 135 Q85 118 55 130" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M110 135 Q135 118 165 130" fill="none" stroke="#4CAF50" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M110 140 Q90 128 60 140" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
          <path d="M110 140 Q130 128 160 140" fill="none" stroke="#66BB6A" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Glow above crescent - subtle, elegant -->
          <ellipse cx="110" cy="-5" rx="20" ry="15" fill="#FFD700" opacity="0.08" filter="url(#softGlow)"/>
          
          <!-- Crescent - clean, premium shape -->
          <path d="M96 8 A14 14 0 1 1 96 -12 A11 11 0 1 0 96 8 Z" fill="#FFD700" filter="url(#softGlow)"/>
          
          <!-- 3 light rays - thin, elegant -->
          <line x1="110" y1="-8" x2="110" y2="-40" stroke="#FFD700" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
          <line x1="95" y1="-2" x2="75" y2="-35" stroke="#FFD700" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
          <line x1="125" y1="-2" x2="145" y2="-35" stroke="#FFD700" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>التصميم - Brandkit Edition</h3>
        <p>بوابة أنيقة + نخل راقي + هلال نضيف + إضاءة هادئة</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>قولي لو الشكل ده أنيق واحترافي أو عايز تعديل</p>
  </div>
</div>
