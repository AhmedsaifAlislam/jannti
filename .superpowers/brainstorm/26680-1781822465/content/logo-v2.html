<div style="text-align:center; padding:20px;">
  <h2>تصميم اللوجو - النسخة المعدّلة</h2>
  <p class="subtitle">A مع فراغ بين البوابة والهلال</p>

  <div class="cards">
    <!-- Design A v2 -->
    <div class="card selected" data-choice="a2" onclick="toggleSelect(this)">
      <div class="card-image" style="background:#0D1F17; padding:30px; display:flex; flex-direction:column; align-items:center; gap:15px;">
        <svg width="120" height="140" viewBox="0 0 120 140">
          <!-- Gate -->
          <path d="M30 105 L30 45 Q60 20 90 45 L90 105" fill="none" stroke="#FFD700" stroke-width="3"/>
          <path d="M35 105 L35 47 Q60 25 85 47 L85 105" fill="none" stroke="#FFD700" stroke-width="1.5"/>
          
          <!-- Palm inside gate -->
          <line x1="60" y1="105" x2="60" y2="65" stroke="#2E7D32" stroke-width="3"/>
          <path d="M60 65 Q45 55 40 60" fill="none" stroke="#4CAF50" stroke-width="2"/>
          <path d="M60 65 Q75 55 80 60" fill="none" stroke="#4CAF50" stroke-width="2"/>
          <path d="M60 68 Q50 60 42 65" fill="none" stroke="#66BB6A" stroke-width="1.5"/>
          <path d="M60 68 Q70 60 78 65" fill="none" stroke="#66BB6A" stroke-width="1.5"/>
          
          <!-- GAP SPACE: crescent is higher up, separated from gate -->
          <!-- Crescent -->
          <circle cx="60" cy="12" r="8" fill="#FFD700"/>
          <circle cx="63" cy="10" r="6" fill="#0D1F17"/>
          
          <!-- Light rays from crescent -->
          <line x1="60" y1="2" x2="60" y2="-5" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
          <line x1="50" y1="5" x2="45" y2="-2" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
          <line x1="70" y1="5" x2="75" y2="-2" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>A - بوابة كلاسيكية (مع فراغ)</h3>
        <p>بوابة مقوسة + نخلة + فراغ + هلال + أشعة ضوء</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>الفراغ بين البوابة والهلال واضح دلوقتي. الهلال فوق البوابة بمسافة</p>
    <p style="color:#FFD700; margin-top:10px;">قولي لو عايز تغيير تاني أو ننتقل للسبلاش</p>
  </div>
</div>
