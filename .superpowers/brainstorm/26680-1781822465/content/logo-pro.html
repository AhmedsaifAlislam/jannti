<div style="text-align:center; padding:20px;">
  <h2>التصميم النهائي - نسخة احترافية</h2>
  <p class="subtitle">إضاءة طبيعية + شعاع نص واضح</p>

  <div class="cards">
    <div class="card selected" data-choice="pro" onclick="toggleSelect(this)">
      <div class="card-image" style="padding:0; display:flex; flex-direction:column; align-items:center; border-radius:12px; overflow:hidden;">
        <svg width="220" height="260" viewBox="-20 -40 240 280">
          <defs>
            <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#0a1a12"/>
              <stop offset="100%" stop-color="#1a3a2a"/>
            </linearGradient>
            <!-- Clean glow - softer, spread higher -->
            <filter id="glow" x="-100%" y="-150%" width="300%" height="400%">
              <feGaussianBlur stdDeviation="5" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          
          <!-- Background -->
          <rect x="-20" y="-40" width="240" height="280" fill="url(#bgGrad)"/>
          
          <!-- Outer gate -->
          <path d="M30 210 L30 85 Q30 65 50 50 L100 15 L150 50 Q170 65 170 85 L170 210" 
                fill="none" stroke="#FFD700" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Inner gate line -->
          <path d="M42 210 L42 88 Q42 70 58 57 L100 28 L142 57 Q158 70 158 88 L158 210" 
                fill="none" stroke="#FFD700" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          
          <!-- Palm trunk -->
          <line x1="100" y1="205" x2="100" y2="115" stroke="#2E7D32" stroke-width="7" stroke-linecap="round"/>
          <!-- Palm fronds -->
          <path d="M100 120 Q75 105 50 115" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 120 Q125 105 150 115" fill="none" stroke="#4CAF50" stroke-width="4" stroke-linecap="round"/>
          <path d="M100 125 Q80 115 55 125" fill="none" stroke="#66BB6A" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M100 125 Q120 115 145 125" fill="none" stroke="#66BB6A" stroke-width="3.5" stroke-linecap="round"/>
          
          <!-- Glow - positioned ABOVE crescent, not on it -->
          <ellipse cx="100" cy="-8" rx="22" ry="18" fill="#FFD700" opacity="0.15" filter="url(#glow)"/>
          
          <!-- Crescent - use path for proper shape, no "sticker" circle -->
          <path d="M88 14 A16 16 0 1 1 88 -2 A12 12 0 1 0 88 14 Z" fill="#FFD700" filter="url(#glow)"/>
          
          <!-- 3 light rays - spread apart clearly -->
          <line x1="100" y1="-5" x2="100" y2="-38" stroke="#FFD700" stroke-width="3.5" opacity="0.7" stroke-linecap="round" filter="url(#glow)"/>
          <line x1="82" y1="5" x2="60" y2="-25" stroke="#FFD700" stroke-width="3" opacity="0.5" stroke-linecap="round" filter="url(#glow)"/>
          <line x1="118" y1="5" x2="140" y2="-25" stroke="#FFD700" stroke-width="3" opacity="0.5" stroke-linecap="round" filter="url(#glow)"/>
        </svg>
      </div>
      <div class="card-body">
        <h3>التصميم - نسخة احترافية</h3>
        <p>هلال طبيعي + إضاءة من فوق + شعاع نص واضح</p>
      </div>
    </div>
  </div>

  <div style="margin-top:20px; padding:15px; background:rgba(255,215,0,0.1); border-radius:12px; border:1px solid rgba(255,215,0,0.2);">
    <p>قولي لو كده الهلال بقى طبيعي والشعاعات واضحة</p>
  </div>
</div>
