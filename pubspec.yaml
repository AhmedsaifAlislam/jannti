name: jannti
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_gl_flutterflow: ^0.0.23
  three_dart_flutterflow: ^0.0.17
  three_dart_jsm_flutterflow: ^0.0.11
  http: ^0.13.6
  path_provider: 2.1.2
  archive: ^3.6.1
  path_provider_foundation: 2.4.0

dependency_overrides:
  shared_preferences_android: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    - family: GESSTwo
      fonts:
        - asset: assets/fonts/GE_SS_Two_Light.ttf
          weight: 300
        - asset: assets/fonts/GE_SS_Two_Medium.ttf
          weight: 500
        - asset: assets/fonts/GE_SS_Two_Bold.otf
          weight: 700

  assets:
    - assets/fonts/
    - assets/images/
    - assets/3d/
