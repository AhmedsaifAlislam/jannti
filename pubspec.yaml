name: jannti
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  flutter_gl_flutterflow: ^0.0.23
  three_dart_flutterflow: ^0.0.17
  three_dart_jsm_flutterflow: ^0.0.11
  http: ^0.13.6
  path_provider: 2.1.2
  archive: ^3.6.1
  path_provider_foundation: 2.4.0
  wakelock_plus: ^1.5.2
  # Model textures are re-encoded from the decoded image so the GL layer gets
  # the raw pixels it expects (see lib/three/model_texture.dart).
  image: ^3.3.0

dependency_overrides:
  shared_preferences_android: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    # اسم قديم محفوظ كمرادف فقط: الشاشة 2D مجمّدة وتستعمل 'GESSTwo'،
    # فنسجّلها على ملفات Cairo نفسها دون لمس تلك الشاشة.
    # (الخط الأصلي GE SS Two تجاري وأُزيل من المشروع.)
    - family: GESSTwo
      fonts:
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
    - assets/images/
    - assets/3d/
    # Directory entries are not recursive in Flutter, so every staged model the
    # 3D scene can load is listed by hand. Keep this list in step with
    # kBundledModelAssets in lib/three/asset_map.dart.
    - assets/3d/tier1/palm_seedling.glb
    - assets/3d/tier1/green_tree_seedling.glb
    - assets/3d/tier2/palm_small.glb
    - assets/3d/tier2/green_tree_small.glb
    - assets/3d/tier3/palm_medium.glb
    - assets/3d/tier3/green_tree_medium.glb
    - assets/3d/tier4/palm_large.glb
    - assets/3d/tier5/fantasy_tree.glb
    - assets/audio/
