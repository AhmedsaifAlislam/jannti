<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Cairo";src:url("assets/fonts/cairo-300.woff2") format("woff2");font-weight:300;font-display:block}
@font-face{font-family:"Cairo";src:url("assets/fonts/cairo-500.woff2") format("woff2");font-weight:500;font-display:block}
@font-face{font-family:"Cairo";src:url("assets/fonts/cairo-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Amiri";src:url("assets/fonts/amiri-400.woff2") format("woff2");font-weight:400;font-display:block}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:"Cairo",sans-serif;
  background:
    radial-gradient(680px 420px at 88% 4%, rgba(26,92,71,.85), transparent 62%),
    radial-gradient(560px 380px at 6% 100%, rgba(16,66,49,.8), transparent 60%),
    linear-gradient(160deg,#082a20,#051711 70%);
  color:#ecf5f0;
  position:relative;
}
.grain{
  position:absolute;inset:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(232,201,122,.13) 1px, transparent 1.5px);
  background-size:24px 24px;
  mask-image:radial-gradient(90% 80% at 60% 30%,#000,transparent 92%);
  -webkit-mask-image:radial-gradient(90% 80% at 60% 30%,#000,transparent 92%);
}
.frame{position:absolute;inset:18px;border:1px solid rgba(232,201,122,.28);border-radius:22px}
.frame::before{content:"";position:absolute;inset:7px;border:1px solid rgba(232,201,122,.10);border-radius:16px}

.copy{position:absolute;top:76px;right:64px;width:660px}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 1px rgba(232,201,122,.4)}
.brand b{font-size:26px;font-weight:700;letter-spacing:0}
.brand span{display:block;font-size:12.5px;font-weight:500;color:#6e8b80;line-height:1;margin-top:4px}

.ayah{font-family:"Amiri",serif;font-size:38px;color:#e8c97a;line-height:1.6;margin-bottom:4px}
.ayah small{display:block;font-family:"Cairo",sans-serif;font-size:13px;color:#6e8b80;font-weight:300;letter-spacing:.05em}

h1{font-size:78px;line-height:1.18;font-weight:700;letter-spacing:-.01em;margin:14px 0 18px}
h1 .gold{background:linear-gradient(120deg,#f6e4b4,#e8c97a 55%,#c9a75b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:20px;font-weight:300;color:#a9c1b6;line-height:1.75;width:600px}
.tags{display:flex;gap:9px;margin-top:24px}
.tag{font-size:13px;font-weight:500;color:#cfdcd5;border:1px solid rgba(232,201,122,.22);background:rgba(232,201,122,.06);border-radius:999px;padding:7px 14px}
.tag.gold{color:#0a2018;background:linear-gradient(135deg,#f0d78f,#e8c97a 55%,#c9a75b);border:0;font-weight:700}

.visual{position:absolute;left:58px;top:48px;width:392px;height:534px;border-radius:40px;padding:9px;
  background:linear-gradient(160deg,#17402f,#06160f);border:1px solid rgba(232,201,122,.32);
  box-shadow:0 40px 90px rgba(0,0,0,.6);transform:rotate(-2.5deg)}
.visual img{width:100%;height:100%;object-fit:cover;object-position:50% 56%;border-radius:33px;display:block}
.visual::after{content:"";position:absolute;inset:9px;border-radius:33px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),transparent 24%,transparent 76%,rgba(0,0,0,.28));pointer-events:none}
.glow{position:absolute;left:80px;top:120px;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(232,201,122,.20),transparent 70%);filter:blur(24px)}
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="frame"></div>
  <div class="glow"></div>

  <div class="copy">
    <div class="brand">
      <img src="assets/img/icon-192.png" alt="">
      <div><b>جنتي</b><span>واحة الذكر وغراس الجنة</span></div>
    </div>
    <div class="ayah">﴿فَاذْكُرُونِي أَذْكُرْكُمْ﴾<small>البقرة ١٥٢</small></div>
    <h1>اذكر، فتنمو <span class="gold">جنتك</span>.</h1>
    <p class="lead">عدّاد أذكار هادئ، وسكينة تُسمَع، وعالم ثلاثي الأبعاد يكبر مع كل ذكر.</p>
    <div class="tags">
      <span class="tag gold">أندرويد — نسخة التجربة</span>
      <span class="tag">iPhone قريبًا</span>
      <span class="tag">بلا إعلانات · بلا حساب</span>
    </div>
  </div>

  <div class="visual">
    <img src="assets/img/hero-garden.webp" alt="">
  </div>
</body>
</html>
